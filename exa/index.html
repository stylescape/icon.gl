<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>icon.gl - Icon Font Library Test Page</title>

        <!-- stylescape (dev-only, served from node_modules by vite.config.js) -->
        <link rel="stylesheet" href="/vendor/stylescape/stylescape.css" />

        <!-- Local build (npm run build) -->
        <link rel="stylesheet" href="../dist/css/icon.gl.css" />

        <style>
            /* Icon grid cells: the only demo-specific styling stylescape has no equivalent for. */
            .icon-grid {
                grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
            }
            .icon-cell {
                align-items: center;
                gap: var(--ss-spacing-2);
                padding: var(--ss-spacing-3) var(--ss-spacing-2);
                font: inherit;
                text-align: center;
            }
            .icon-cell .i {
                font-size: var(--icon-size, 2em);
            }
        </style>
    </head>
    <body>
        <header class="ss-l-container ss-l-region ss-l-region-sm ss-u-text-center">
            <h1 class="ss-t-h1">icon.gl</h1>
            <p class="ss-t-lead ss-u-m-auto">
                A comprehensive icon font library and framework. Browse and explore all available
                icons below using the icon font from the local build.
            </p>
            <div class="ss-c-stats ss-u-mt-4">
                <div class="ss-c-stat">
                    <div class="ss-c-stat__title">Total Icons</div>
                    <div class="ss-c-stat__value" id="total-icons">-</div>
                </div>
                <div class="ss-c-stat">
                    <div class="ss-c-stat__title">Categories</div>
                    <div class="ss-c-stat__value" id="total-categories">-</div>
                </div>
                <div class="ss-c-stat">
                    <div class="ss-c-stat__title">Version</div>
                    <div class="ss-c-stat__value" id="version">-</div>
                </div>
            </div>
        </header>

        <div class="ss-u-sticky ss-u-top-0 ss-u-z-sticky ss-a-surface ss-a-border-b ss-u-py-3">
            <div class="ss-l-container ss-c-toolbar ss-u-flex-wrap">
                <div class="ss-c-formfield ss-u-flex-grow-1">
                    <label class="ss-c-label" for="search">Search</label>
                    <input
                        class="ss-c-input"
                        type="search"
                        id="search"
                        placeholder="Search icons..."
                        autocomplete="off"
                    />
                </div>
                <div class="ss-c-formfield">
                    <label class="ss-c-label" for="size">Size</label>
                    <select class="ss-c-select" id="size">
                        <option value="1em">1x</option>
                        <option value="1.5em">1.5x</option>
                        <option value="2em" selected>2x</option>
                        <option value="3em">3x</option>
                        <option value="4em">4x</option>
                        <option value="5em">5x</option>
                    </select>
                </div>
            </div>
        </div>

        <main class="ss-l-container ss-l-region ss-l-region-sm" id="icon-container"></main>

        <ul class="ss-c-toast-region" data-position="bottom-right" aria-live="polite">
            <li class="ss-c-toast ss-c-toast--success" id="toast" hidden>Icon name copied!</li>
        </ul>

        <footer class="ss-l-container ss-l-region ss-l-region-sm ss-a-border-t ss-u-text-center">
            <p class="ss-t-small">
                <strong>icon.gl</strong> by
                <a href="https://github.com/stylescape" target="_blank">Scape Press</a> |
                <a href="https://github.com/stylescape/icon.gl" target="_blank">GitHub</a> |
                <a href="https://www.icon.gl/" target="_blank">Documentation</a>
            </p>
        </footer>

        <script>
            // Icon ids per category, generated by scripts/build-icons.mjs
            async function loadIcons() {
                const [index, pkg] = await Promise.all([
                    fetch('../src/json/icongl/index.json').then((r) => r.json()),
                    fetch('../package.json').then((r) => r.json()),
                ])
                document.getElementById('version').textContent = `v${pkg.version}`
                return Object.fromEntries(
                    Object.entries(index.categories).map(([category, ids]) => [
                        category,
                        ids.map((id) => `i_${id}`),
                    ]),
                )
            }

            // Show toast notification
            function showToast(message) {
                const toast = document.getElementById('toast')
                toast.textContent = message
                toast.hidden = false
                clearTimeout(showToast.timeout)
                showToast.timeout = setTimeout(() => (toast.hidden = true), 2000)
            }

            // Create an icon element
            function createIconElement(iconClass) {
                const item = document.createElement('button')
                item.type = 'button'
                item.className = 'ss-c-card ss-c-card--interactive icon-cell'
                item.dataset.name = iconClass

                const displayName = iconClass.replace('i_', '').replace(/_/g, ' ')

                const icon = document.createElement('span')
                icon.className = `i ${iconClass}`
                const name = document.createElement('span')
                name.className = 'ss-t-caption ss-u-break-words'
                name.textContent = displayName
                item.append(icon, name)

                item.addEventListener('click', () => {
                    navigator.clipboard.writeText(iconClass).then(() => {
                        showToast(`Copied: ${iconClass}`)
                    })
                })

                return item
            }

            // Filter icons based on search
            function filterIcons(query) {
                const items = document.querySelectorAll('.icon-cell')
                const q = query.toLowerCase().trim()
                let visibleCount = 0

                items.forEach((item) => {
                    const name = item.dataset.name.toLowerCase()
                    const match = !q || name.includes(q)
                    item.hidden = !match
                    if (match) visibleCount++
                })

                // Show/hide category sections based on visible icons
                document.querySelectorAll('[data-category]').forEach((cat) => {
                    cat.hidden = !cat.querySelector('.icon-cell:not([hidden])')
                })

                // Show no results message if needed
                let noResults = document.getElementById('no-results')
                if (visibleCount === 0 && q) {
                    if (!noResults) {
                        noResults = document.createElement('div')
                        noResults.id = 'no-results'
                        noResults.className = 'ss-c-empty-state ss-u-p-8'
                        document.getElementById('icon-container').appendChild(noResults)
                    }
                    // textContent, not innerHTML: the query is user input
                    const message = document.createElement('p')
                    const strong = document.createElement('strong')
                    strong.textContent = q
                    message.append('No icons found matching "', strong, '"')
                    noResults.replaceChildren(message)
                } else if (noResults) {
                    noResults.remove()
                }
            }

            // Update icon size
            function updateIconSize(size) {
                document.documentElement.style.setProperty('--icon-size', size)
            }

            // Initialize the page
            async function init() {
                const iconsByCategory = await loadIcons()
                const container = document.getElementById('icon-container')
                let totalIcons = 0

                // Render icons by category
                for (const [category, icons] of Object.entries(iconsByCategory)) {
                    const categoryDiv = document.createElement('section')
                    categoryDiv.className = 'ss-u-mb-8'
                    categoryDiv.dataset.category = category
                    const header = document.createElement('div')
                    header.className = 'ss-l-hstack ss-u-justify-between ss-u-mb-4 ss-u-pb-2 ss-a-border-b'
                    const title = document.createElement('h2')
                    title.className = 'ss-t-h4 ss-u-m-0'
                    title.textContent = category
                    const count = document.createElement('span')
                    count.className = 'ss-c-badge ss-c-badge--muted'
                    count.textContent = `${icons.length} icons`
                    header.append(title, count)
                    const grid = document.createElement('div')
                    grid.className = 'ss-l-grid ss-l-grid-gap-sm icon-grid'
                    grid.id = `grid-${category.replace(/\s+/g, '-')}`
                    categoryDiv.append(header, grid)
                    container.appendChild(categoryDiv)

                    icons.forEach((iconClass) => {
                        grid.appendChild(createIconElement(iconClass))
                        totalIcons++
                    })
                }

                // Update stats
                document.getElementById('total-icons').textContent = totalIcons
                document.getElementById('total-categories').textContent =
                    Object.keys(iconsByCategory).length

                // Setup search
                const searchInput = document.getElementById('search')
                searchInput.addEventListener('input', (e) => filterIcons(e.target.value))

                // Setup size select
                const sizeSelect = document.getElementById('size')
                sizeSelect.addEventListener('change', (e) => updateIconSize(e.target.value))
            }

            // Start
            init()
        </script>
    </body>
</html>
