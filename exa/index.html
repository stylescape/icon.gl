        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Create an icon element
        function createIconElement(iconClass) {
            const item = document.createElement('div');
            item.className = 'icon-item';
            item.dataset.name = iconClass;

            const displayName = iconClass.replace('i_', '').replace(/_/g, ' ');

            item.innerHTML = `
                <span class="i ${iconClass}"></span>
                <span class="icon-name">${displayName}</span>
            `;

            item.addEventListener('click', () => {
                navigator.clipboard.writeText(iconClass).then(() => {
                    showToast(`Copied: ${iconClass}`);
                });
            });

            return item;
        }

        // Filter icons based on search
        function filterIcons(query) {
            const items = document.querySelectorAll('.icon-item');
            const q = query.toLowerCase().trim();
            let visibleCount = 0;

            items.forEach(item => {
                const name = item.dataset.name.toLowerCase();
                const match = !q || name.includes(q);
                item.classList.toggle('hidden', !match);
                if (match) visibleCount++;
            });

            // Show/hide category sections based on visible icons
            document.querySelectorAll('.category').forEach(cat => {
                const visibleItems = cat.querySelectorAll('.icon-item:not(.hidden)');
                cat.style.display = visibleItems.length ? 'block' : 'none';
            });

            // Show no results message if needed
            let noResults = document.getElementById('no-results');
            if (visibleCount === 0 && q) {
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.id = 'no-results';
                    noResults.className = 'no-results';
                    document.getElementById('icon-container').appendChild(noResults);
                }
                noResults.innerHTML = `<p>No icons found matching "<strong>${q}</strong>"</p>`;
            } else if (noResults) {
                noResults.remove();
            }
        }

        // Update icon size
        function updateIconSize(size) {
            document.documentElement.style.setProperty('--icon-size', size);
        }

        // Initialize the page
        function init() {
            const container = document.getElementById('icon-container');
            let totalIcons = 0;

            // Render icons by category
            for (const [category, icons] of Object.entries(iconsByCategory)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.innerHTML = `
                    <div class="category-header">
                        <h2 class="category-title">${category}</h2>
                        <span class="category-count">${icons.length} icons</span>
                    </div>
                    <div class="icon-grid" id="grid-${category.replace(/\s+/g, '-')}"></div>
                `;
                container.appendChild(categoryDiv);

                const grid = categoryDiv.querySelector('.icon-grid');
                icons.forEach(iconClass => {
                    grid.appendChild(createIconElement(iconClass));
                    totalIcons++;
                });
            }

            // Update stats
            document.getElementById('total-icons').textContent = totalIcons;
            document.getElementById('total-categories').textContent = Object.keys(iconsByCategory).length;

            // Setup search
            const searchInput = document.getElementById('search');
            searchInput.addEventListener('input', (e) => filterIcons(e.target.value));

            // Setup size select
            const sizeSelect = document.getElementById('size');
            sizeSelect.addEventListener('change', (e) => updateIconSize(e.target.value));
        }

        // Start
        init();
    </script>
