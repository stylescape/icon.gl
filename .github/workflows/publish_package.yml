name: Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: write # Required for creating releases
  packages: write # Required for GitHub Packages

jobs:
  # =============================================================================
  # Build
  # =============================================================================

  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      # - name: Check if version has been updated
      #   id: check
      #   uses: EndBug/version-check@v2

      - name: NPM Install
        # if: steps.check.outputs.changed == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # -
      #   name: NPM Run Lint
      #   run: |
      #     npm run lint --if-present

      - name: NPM Run Test
        run: |
          npm run test --if-present

      - name: NPM Run Build
        run: |
          npm run build --if-present

      - name: Zip dist & node_modules
        run: zip -9qry "build.zip" "./" -i "node_modules/*" -i "dist/*"

      - name: Upload build.zip
        uses: actions/upload-artifact@v7
        with:
          name: build.zip
          path: build.zip

  # =============================================================================
  # Create a GitHub Release
  # =============================================================================

  release:
    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Download build.zip
        uses: actions/download-artifact@v8
        with:
          name: build.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build.zip
          asset_name: build.zip
          asset_content_type: application/zip

  # =============================================================================
  # Publish to NPM
  # =============================================================================

  publish-npm:
    name: Publish NPM

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download build.zip
        uses: actions/download-artifact@v8
        with:
          name: build.zip

      - name: Unzip build.zip
        run: unzip -q -o build.zip

      - name: Publish NPM with Trusted Publishing
        run: |
          cd dist
          npm publish --access public
        # No NODE_AUTH_TOKEN needed - uses OIDC automatically

