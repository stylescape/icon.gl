---

# =============================================================================
# icon.gl Production Build Configuration
# =============================================================================
# This kist configuration replaces the build functionality from bin/ts/index.ts
# Run with: npx kist --config ./kist.pro.yml
#
# All steps are in a single stage to ensure sequential execution.
# =============================================================================

options:
    mode: production
    live:
        enabled: false
    logLevel: info

# =============================================================================
# Build Pipeline (Single Stage for Sequential Execution)
# =============================================================================

stages:
    - name: Build
      description: "Build icon.gl assets"
      steps:
          # =====================================================================
          # 1. Clean
          # =====================================================================
          - name: CleanDistDirectory
            action: DirectoryCleanAction
            options:
                dirPath: "./dist"

          # =====================================================================
          # 2. Create Directory Structure
          # =====================================================================
          - name: CreateDistDirs
            action: DirectoryCreateAction
            options:
                basePath: "./dist"
                directories:
                    - svg
                    - png
                    - sprite
                    - font
                    - css
                    - scss
                    - ts
                    - js
                    - json
                    - html
                    - md

          # =====================================================================
          # 3. Process SVG Files
          # =====================================================================
          # NOTE: For full SVG processing (optimization, TypeScript generation,
          # sprite generation with recursive directories), use the original
          # bin/js/index.js script via:
          #   npm run build-compile && npm run build-process
          #
          # The kist SVG actions currently have the following limitations:
          # - SvgPackagerAction: timing issues with large file sets
          # - SvgSpriteAction: doesn't search subdirectories recursively
          #
          # For now, kist handles: copying, SCSS, templates, packaging
          
          # Copy SVG files (preserves directory structure)
          - name: CopySvgFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/svg"
                destDir: "./dist/svg"

          # For full SVG processing, uncomment and use RunScriptAction:
          # - name: ProcessSvgWithScript
          #   action: RunScriptAction
          #   options:
          #       command: "npm run build-compile && npm run build-process"

          # =====================================================================
          # 4. Process Styles
          # =====================================================================
          # Expanded CSS
          - name: CompileScssExpanded
            action: StyleProcessingAction
            options:
                inputFile: "./src/scss/index.scss"
                outputFile: "./dist/css/icon.gl.css"
                styleOption: "expanded"

          # Minified CSS
          - name: CompileScssMinified
            action: StyleProcessingAction
            options:
                inputFile: "./src/scss/index.scss"
                outputFile: "./dist/css/icon.gl.min.css"
                styleOption: "compressed"

          # =====================================================================
          # 5. Copy Source Files
          # =====================================================================
          # Copy TypeScript sources
          - name: CopyTypeScriptSources
            action: DirectoryCopyAction
            options:
                srcDir: "./src/ts"
                destDir: "./dist/ts"

          # Copy SCSS sources
          - name: CopyScssSources
            action: DirectoryCopyAction
            options:
                srcDir: "./src/scss"
                destDir: "./dist/scss"

          # Copy Font files
          - name: CopyFontFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/font"
                destDir: "./dist/font"

          # Copy HTML files
          - name: CopyHtmlFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/html"
                destDir: "./dist/html"

          # Copy JSON files
          - name: CopyJsonFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/json"
                destDir: "./dist/json"

          # Copy README
          - name: CopyReadme
            action: FileCopyAction
            options:
                srcFile: "./README.md"
                destDir: "./dist"

          # Copy LICENSE
          - name: CopyLicense
            action: FileCopyAction
            options:
                srcFile: "./LICENSE"
                destDir: "./dist"

          # =====================================================================
          # 6. Generate Documentation
          # =====================================================================
          - name: GenerateIconMarkdown
            action: TemplateRenderAction
            options:
                templatePath: "./src/jinja/icon.gl.md.jinja"
                outputPath: "./dist/md/icon.gl.md"
                context:
                    title: "icon.gl Icons"
                    version: "0.0.35"

          # =====================================================================
          # 7. Finalize
          # =====================================================================
          # Generate package.json for dist
          - name: GeneratePackageJson
            action: PackageManagerAction
            options:
                packageJsonPath: "./package.json"
                outputDir: "./dist"
                fields:
                    - name
                    - version
                    - description
                    - keywords
                    - license
                    - homepage
                    - author
                    - contributors
                    - repository
                    - funding
                    - exports
                    - main
                    - module
                    - style
                    - sass

          # Update version in files
          - name: UpdateVersionFiles
            action: VersionWriteAction
            options:
                files:
                    - path: "./CITATION.cff"
                      key: "version: "
                    - path: "./VERSION"
                      key: "v"
