---

# =============================================================================
# icon.gl Production Build Configuration
# =============================================================================
# Simplified configuration focusing on available Kist actions
# Includes icon font generation from SVG files
# =============================================================================

options:
    mode: production
    live:
        enabled: false
    logLevel: info

# =============================================================================
# Build Pipeline
# =============================================================================

stages:
    - name: Build
      description: "Build icon.gl assets"
      steps:
          # =====================================================================
          # 1. Clean Distribution Directory
          # =====================================================================
          - name: CleanDistDirectory
            action: DirectoryCleanAction
            options:
                dirPath: "./dist"

          # =====================================================================
          # 2. Create Distribution Directory Structure
          # =====================================================================
          - name: CreateDistDirs
            action: DirectoryCreateAction
            options:
                basePath: "./dist"
                directories:
                    - svg
                    - font
                    - css
                    - scss
                    - ts
                    - js
                    - json
                    - html
                    - md

          # =====================================================================
          # 3. Copy SVG Source Files
          # =====================================================================
          - name: CopySvgFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/svg"
                destDir: "./dist/svg"

          # =====================================================================
          # 4. Generate Icon Fonts from SVG
          # =====================================================================
          - name: GenerateIconFonts
            action: FantasticonAction
            options:
                inputDir: "./src/svg"
                outputDir: "./dist/font"
                fontName: "icon.gl"
                classPrefix: "icon"
                formats:
                    - woff2
                    - woff
                typescript: true

          # =====================================================================
          # 5. Copy Source Files
          # =====================================================================
          - name: CopyTypeScriptSources
            action: DirectoryCopyAction
            options:
                srcDir: "./src/ts"
                destDir: "./dist/ts"

          - name: CopyScssSources
            action: DirectoryCopyAction
            options:
                srcDir: "./src/scss"
                destDir: "./dist/scss"

          - name: CopyHtmlFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/html"
                destDir: "./dist/html"

          - name: CopyJsonFiles
            action: DirectoryCopyAction
            options:
                srcDir: "./src/json"
                destDir: "./dist/json"

          - name: CopyReadme
            action: FileCopyAction
            options:
                srcFile: "./README.md"
                destDir: "./dist"

          - name: CopyLicense
            action: FileCopyAction
            options:
                srcFile: "./LICENSE"
                destDir: "./dist"

          # =====================================================================
          # 6. Finalize
          # =====================================================================
          - name: GeneratePackageJson
            action: PackageManagerAction
            options:
                packageJsonPath: "./package.json"
                outputDir: "./dist"
                fields:
                    - name
                    - version
                    - description
                    - keywords
                    - license
                    - homepage
                    - author
                    - contributors
                    - repository
                    - funding
                    - exports
                    - main
                    - module
                    - style
                    - sass
                    - files

          - name: UpdateVersionFiles
            action: VersionWriteAction
            options:
                files:
                    - path: "./CITATION.cff"
                      key: "version: "
                    - path: "./VERSION"
                      key: "v"
