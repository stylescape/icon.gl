---

# =============================================================================
# Options
# =============================================================================

options:
    mode: development
    live:
        enabled: false
        port: 3000
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**
    logLevel: debug

# =============================================================================
# Stages
# =============================================================================

stages:
    - name: Build
      description: "Build icon.gl assets"
      steps:
          # Clean dist directory
          - name: CleanBuildDir
            action: DirectoryCleanAction
            options:
                dirPath: "./dist"

          # Process SCSS - minified
          - name: ProcessMainStyles
            action: StyleProcessingAction
            options:
                inputFile: "./src/scss/index.scss"
                outputFile: "./dist/css/icon.gl.min.css"
                styleOption: "compressed"

          # Process SCSS - expanded
          - name: ProcessExpandedStyles
            action: StyleProcessingAction
            options:
                inputFile: "./src/scss/index.scss"
                outputFile: "./dist/css/icon.gl.css"
                styleOption: "expanded"

          # Copy LICENSE
          - name: CopyLICENSE
            action: FileCopyAction
            options:
                srcFile: "./LICENSE"
                destDir: "./dist"

          # Copy README
          - name: CopyREADME
            action: FileCopyAction
            options:
                srcFile: "./README.md"
                destDir: "./dist"

          # Copy SCSS sources
          - name: CopySrcSCSS
            action: DirectoryCopyAction
            options:
                srcDir: "./src/scss"
                destDir: "./dist/scss"

          # Copy TypeScript sources
          - name: CopySrcTS
            action: DirectoryCopyAction
            options:
                srcDir: "./src/ts"
                destDir: "./dist/ts"

          # Copy SVG sources
          - name: CopySrcSVG
            action: DirectoryCopyAction
            options:
                srcDir: "./src/svg"
                destDir: "./dist/svg"

          # Copy JSON sources
          - name: CopySrcJSON
            action: DirectoryCopyAction
            options:
                srcDir: "./src/json"
                destDir: "./dist/json"

          # NOTE: TypeScript compilation disabled - source files need .js extensions in imports
          # - name: CompileTypeScript
          #   action: TypeScriptCompilerAction
          #   options:
          #       tsConfigPath: "./tsconfig.json"

          # Generate package.json for dist
          - name: GeneratePackageJson
            action: PackageManagerAction
            options:
                packageJsonPath: "./package.json"
                outputDir: "./dist"
                fields:
                    - name
                    - version
                    - dependencies
                    - description
                    - keywords
                    - license
                    - homepage
                    - author
                    - contributors
                    - repository
                    - funding
                    - exports

          # Update version in files
          - name: UpdateVersion
            action: VersionWriteAction
            options:
                files:
                    - path: "./CITATION.cff"
                      key: "version: "
                    - path: "./VERSION"
                      key: "v"
