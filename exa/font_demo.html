<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>icon.gl — Font Demo (every i_* class)</title>
    <!-- stylescape (dev-only, served from node_modules by vite.config.js) -->
    <link rel="stylesheet" href="/vendor/stylescape/stylescape.css">
    <style>
        @font-face {
            font-display: swap;
            font-family: "icongl";
            src: url("../dist/font/icongl.woff2") format("woff2"),
                 url("../dist/font/icongl.woff") format("woff");
        }
        /* Icon grid cells: the only demo-specific styling stylescape has no equivalent for. */
        .icon-grid { grid-template-columns: repeat(auto-fill, minmax(8.75rem, 1fr)); }
        .icon-cell {
            align-items: center;
            gap: var(--ss-spacing-2);
            padding: var(--ss-spacing-3) var(--ss-spacing-2);
            font: inherit;
            text-align: center;
        }

        /* ================================================================
           icon.gl base styles — mirrors src/scss/classes/_style.scss
           This is exactly how icons are rendered in production.
           ================================================================ */
        .i {
            display: inline-flex;
            position: relative;
            vertical-align: baseline;
            box-sizing: content-box;
            margin: 0;
            padding: 0;
            font-size: inherit;
            width: 1.5em;
            height: 1.5em;
            aspect-ratio: 1 / 1;
            color: inherit;
            background-color: transparent;
            overflow: visible;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .i::before,
        [class^="i_"]::before,
        [class*=" i_"]::before {
            font-family: "icongl" !important;
            font-size: 1.5em;
            font-style: normal;
            font-weight: normal !important;
            font-variant: normal;
            font-variant-emoji: text;
            text-transform: none;
            text-emphasis-style: none;
            line-height: 1;
            color: inherit;
            display: inline;
            vertical-align: middle;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
    <!-- Dynamic icon class rules are injected here by JS -->
    <style id="icon-classes"></style>
</head>
<body>
    <header class="ss-l-container ss-l-region ss-l-region-sm">
        <h1 class="ss-t-h1">icon.gl — font demo</h1>
        <p class="ss-t-lead">
            Every icon is rendered using the actual CSS class convention:
            <code>&lt;i class="i i_&lt;name&gt;"&gt;&lt;/i&gt;</code> with
            <code>::before { content: "\\xxxx"; }</code>. This validates
            that the built font + SCSS class map work correctly.
        </p>
    </header>

    <div class="ss-u-sticky ss-u-top-0 ss-u-z-sticky ss-a-surface ss-a-border-b ss-u-py-3">
      <div class="ss-l-container ss-c-toolbar ss-u-flex-wrap">
        <div class="ss-c-formfield ss-u-flex-grow-1">
            <label class="ss-c-label" for="search">Filter</label>
            <input class="ss-c-input" id="search" type="search" placeholder="Filter by name (e.g. arrow_up, app_solution)..." autocomplete="off">
        </div>
        <div class="ss-c-formfield">
            <label class="ss-c-label" for="size">Size</label>
            <select class="ss-c-select" id="size">
                <option value="1.5em">1.5x</option>
                <option value="2em">2x</option>
                <option value="2.4em" selected>2.4x</option>
                <option value="3em">3x</option>
                <option value="4em">4x</option>
            </select>
        </div>
        <span class="ss-t-small ss-u-self-end ss-u-py-2" id="stat" role="status">loading…</span>
      </div>
    </div>

    <main class="ss-l-container ss-l-region ss-l-region-sm" id="root"><div class="ss-c-empty-state ss-u-p-8">Loading icons…</div></main>
    <ul class="ss-c-toast-region" data-position="bottom-right" aria-live="polite">
        <li class="ss-c-toast ss-c-toast--success" id="toast" hidden>copied</li>
    </ul>

    <script type="module">
        const root = document.getElementById("root");
        const stat = document.getElementById("stat");
        const search = document.getElementById("search");
        const sizeSel = document.getElementById("size");
        const toast = document.getElementById("toast");
        const iconClassesStyle = document.getElementById("icon-classes");

        async function load() {
            const [codepoints, categoriesDoc] = await Promise.all([
                fetch("../dist/font/icongl.json").then(r => r.json()),
                fetch("../src/json/icongl/index.json").then(r => r.json()).catch(() => ({ categories: {} })),
            ]);

            // Generate .i_<name>::before { content: "\\xxxx"; } rules dynamically
            // This mirrors what src/scss/classes/_style.scss produces.
            const cssRules = Object.entries(codepoints)
                .map(([name, cp]) => `.i_${name}::before { content: "\\${cp.toString(16)}\\fe0e"; }`)
                .join("\n");
            iconClassesStyle.textContent = cssRules;

            // Build name -> category lookup; fall back to "uncategorized".
            const cats = categoriesDoc.categories || {};
            const nameToCat = new Map();
            for (const [cat, names] of Object.entries(cats)) {
                for (const n of names) nameToCat.set(n, cat);
            }

            const allNames = Object.keys(codepoints).sort();
            for (const n of allNames) {
                if (!nameToCat.has(n)) nameToCat.set(n, "uncategorized");
            }

            const grouped = new Map();
            for (const n of allNames) {
                const c = nameToCat.get(n);
                if (!grouped.has(c)) grouped.set(c, []);
                grouped.get(c).push(n);
            }
            const sortedCats = [...grouped.keys()].sort();

            stat.textContent = `${allNames.length} icons across ${sortedCats.length} categories`;

            function render(filter) {
                const f = filter.trim().toLowerCase();
                root.innerHTML = "";
                let total = 0;
                for (const cat of sortedCats) {
                    const items = grouped.get(cat).filter(n => !f || n.toLowerCase().includes(f));
                    if (!items.length) continue;
                    total += items.length;
                    const sec = document.createElement("section");
                    sec.className = "ss-u-mb-8";
                    const h = document.createElement("h2");
                    h.className = "ss-t-h6 ss-t-h6--caps";
                    h.textContent = `${cat}  (${items.length})`;
                    sec.appendChild(h);
                    const grid = document.createElement("div");
                    grid.className = "ss-l-grid ss-l-grid-gap-sm icon-grid";
                    for (const name of items) {
                        const cp = codepoints[name];
                        const card = document.createElement("button");
                        card.type = "button";
                        card.className = "ss-c-card ss-c-card--interactive icon-cell";
                        card.title = `<i class="i i_${name}"></i>  \\${cp.toString(16)}`;
                        card.dataset.name = name;
                        // Use the actual .i .i_<name> class convention
                        const icon = document.createElement("i");
                        icon.className = `i i_${name}`;
                        const nm = document.createElement("span");
                        nm.className = "ss-t-caption ss-u-break-all";
                        nm.textContent = name;
                        const c = document.createElement("code");
                        c.className = "ss-t-caption";
                        c.textContent = `\\${cp.toString(16)}`;
                        card.append(icon, nm, c);
                        grid.appendChild(card);
                    }
                    sec.appendChild(grid);
                    root.appendChild(sec);
                }
                if (!total) {
                    const empty = document.createElement("div");
                    empty.className = "ss-c-empty-state ss-u-p-8";
                    empty.textContent = `No icons match "${filter}"`;
                    root.replaceChildren(empty);
                }
            }

            function applySize() {
                document.querySelectorAll(".icon-cell .i").forEach(icon => {
                    icon.style.fontSize = sizeSel.value;
                });
            }

            let toastTimeout;

            render("");
            applySize();

            search.addEventListener("input", () => { render(search.value); applySize(); });
            sizeSel.addEventListener("change", applySize);

            root.addEventListener("click", async (e) => {
                const card = e.target.closest(".icon-cell");
                if (!card) return;
                try {
                    await navigator.clipboard.writeText(`i i_${card.dataset.name}`);
                    toast.textContent = `copied: i i_${card.dataset.name}`;
                    toast.hidden = false;
                    clearTimeout(toastTimeout);
                    toastTimeout = setTimeout(() => { toast.hidden = true; }, 1100);
                } catch {
                    /* ignore */
                }
            });
        }

        load().catch(err => {
            root.innerHTML = `<div class="ss-c-empty-state ss-u-p-8">Failed to load: ${err.message}</div>`;
            console.error(err);
        });
    </script>
</body>
</html>
